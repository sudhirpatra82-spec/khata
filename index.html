<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Khata</title>
<style>
:root{--bg:#f3f5f1;--ink:#1d2a24;--mute:#6b7a72;--card:#fff;--line:#dfe5df;--green:#1b7a4b;--red:#c23b2e;--brand:#14532d}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh}
header{background:var(--brand);color:#fff;padding:18px 16px 22px}
header h1{font-size:20px;font-weight:700}
.total{margin-top:10px;font-size:13px;opacity:.85}
.total b{display:block;font-size:32px;font-weight:800;opacity:1;margin-top:2px}
.bar{display:flex;gap:8px;padding:12px 16px}
input,button{font:inherit}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.ghost{background:#e6ece6;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);margin:0 16px 8px;padding:14px;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
.row small{color:var(--mute);display:block;margin-top:2px}
.amt{font-weight:800;font-size:17px}
.due{color:var(--red)}.adv{color:var(--green)}.zero{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 24px;line-height:1.5}
.back{background:none;border:0;color:#fff;font-weight:700;cursor:pointer;padding:0 0 10px;font-size:15px}
.actions{display:flex;gap:8px;padding:12px 16px}.actions .btn{flex:1}
.entry{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.entry small{color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;display:grid;gap:10px}
.box h2{font-size:18px}
.hide{display:none}
.link{background:none;border:0;color:var(--red);padding:16px;cursor:pointer;font-weight:600}
.xdel{background:none;border:0;color:var(--mute);font-size:12px;padding:6px 0 0;cursor:pointer;text-decoration:underline}
.entry .amt{text-align:right}
textarea{width:100%;padding:12px;border
(textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
</style>
</head>
<body>

<div id="home">
  <header>
    <h1>Digital Khata</h1>
    <div class="total">Total baaki (aapko milna hai)<b id="tot">₹0</b></div>
  </header>
  <div class="bar">
    <input id="q" placeholder="Customer dhundhein…" aria-label="Search">
    <button class="btn" id="addC">+ Naya</button>
  </div>
  <div id="list"></div>
  <div class="actions"><button class="btn ghost" id="bk">Backup aur Restore</button></div>
</div><div id="detail" class="hide">
  <header>
    <button class="back" id="back">← Wapas</button>
    <h1 id="dName"></h1>
    <div class="total" id="dPhone"></div>
    <div class="total">Baaki<b id="dBal"></b></div>
  </header>
  <div class="actions">
    <button class="btn red" id="giveBtn">Udhaar diya</button>
    <button class="btn green" id="getBtn">Paisa mila</button>
  </div>
  <div class="actions"><button class="btn ghost" id="wa">WhatsApp par yaad dilayein</button></div>
  <div id="entries"></div>
  <button class="link" id="delC">Is customer ko hatayein</button>
</div><div class="sheet" id="sheetC">
  <div class="box">
    <h2>Naya customer</h2>
    <input id="cName" placeholder="Naam">
    <input id="cPhone" type="tel" placeholder="Mobile number (WhatsApp ke liye)">
    <button class="btn" id="saveC">Save karein</button>
    <button class="btn ghost" data-close>Cancel</button>
  </div>
</div><div class="sheet" id="sheetE">
  <div class="box">
    <h2 id="eTitle"></h2>
    <input id="eAmt" type="number" inputmode="decimal" placeholder="Rakam (₹)">
    <input id="eNote" placeholder="Note (jaise: 2 kg chawal)">
    <button class="btn" id="saveE">Save karein</button>
    <button class="btn ghost" data-close>Cancel</button>
  </div>
</div>

<div class="sheet" id="sheetB">
  <div class="box">
    <h2>Backup aur Restore</h2>
    <button class="btn green" id="bkWa">Backup WhatsApp par bhejein</button>
    <button class="btn ghost" id="bkShow">Backup text dikhayein</button>
    <textarea id="bkTxt" rows="5" placeholder="Restore ke liye backup text yahan paste karein"></textarea>
    <button class="btn" id="bkRestore">Restore karein (abhi ka data badal jayega)</button>
    <button class="btn ghost" data-close>Band karein</button>
  </div>
</div><script>
const $ = id => document.getElementById(id);
let data = [], cur = null, mode = 1;

function load(){ try{ data = JSON.parse(localStorage.getItem("khata")) || []; }catch(e){ data = []; } }
function save(){ try{ localStorage.setItem("khata", JSON.stringify(data)); }catch(e){} }
const bal = c => c.entries.reduce((s,e)=>s+e.amt,0);
const rs = n => "₹" + Math.abs(n).toLocaleString("en-IN");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => s.replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function cls(b){ return b>0 ? "due" : b<0 ? "adv" : "zero"; }

function renderHome(){
  const q = $("q").value.trim().toLowerCase();
  $("tot").textContent = rs(data.reduce((s,c)=>s+Math.max(bal(c),0),0));
  const rows = data.filter(c => c.name.toLowerCase().includes(q))
    .sort((a,b)=>bal(b)-bal(a));
  $("list").innerHTML = rows.length ? rows.map(c => {
    const b = bal(c);
    return `<div class="row" data-id="${c.id}" tabindex="0"><div>${esc(c.name)}<small>${esc(c.phone||"Number nahi")}</small></div>
    <div class="amt ${cls(b)}">${b===0?"Hisaab saaf":rs(b)}<small>${b>0?"milna hai":b<0?"dena hai":""}</small></div></div>`;
  }).join("") : `<div class="empty">${data.length ? "Koi customer nahi mila." : "Abhi koi customer nahi hai.<br>Upar “+ Naya” dabakar pehla customer jodein."}</div>`;
}

function renderDetail(){
  const c = data.find(x=>x.id===cur); if(!c) return show("home");
  const b = bal(c);
  $("dName").textContent = c.name;
  $("dPhone").textContent = c.phone || "";
  $("dBal").textContent = (b<0?"Aapko dena hai ":"") + rs(b);
  $("entries").innerHTML = c.entries.slice().reverse().map(e =>
    `<div class="entry"><div>${esc(e.note||(e.amt>0?"Udhaar":"Jama"))}<br><small>${e.date}</small></div>
    <div class="amt ${e.amt>0?"due":"adv"}">${e.amt>0?"+":"−"}${rs(e.amt)}<br><button class="xdel" data-e="${e.id}">hatayein</button></div></div>`).join("")
    || `<div class="empty">Abhi koi entry nahi hai.</div>`;
}

function show(v){
  $("home").classList.toggle("hide", v!=="home");
  $("detail").classList.toggle("hide", v!=="detail");$("q").oninput = renderHome;
$("addC").onclick = () => { $("cName").value=""; $("cPhone").value=""; open("sheetC"); $("cName").focus(); };
document.querySelectorAll("[data-close]").forEach(b => b.onclick = close);

$("saveC").onclick = () => {
  const name = $("cName").value.trim();
  if(!name){ $("cName").focus(); return; }
  data.push({id:uid(), name, phone:$("cPhone").value.trim(), entries:[]});
  save(); close(); renderHome();
};

function openRow(e){ const r = e.target.closest(".row"); if(r){ cur = r.dataset.id; show("detail"); } }
$("list").onclick = openRow;
$("list").onkeydown = e => { if(e.key==="Enter") openRow(e); };
$("back").onclick = () => show("home");

function entry(m){
  mode = m;
  $("eTitle").textContent = m>0 ? "Udhaar diya" : "Paisa mila";
  $("eAmt").value = ""; $("eNote").value = "";
  open("sheetE"); $("eAmt").focus();
}
$("giveBtn").onclick = () => entry(1);
$("getBtn").onclick = () => entry(-1);

$("saveE").onclick = () => {
  const n = parseFloat($("eAmt").value);
  if(!(n>0)){ $("eAmt").focus(); return; }
  const c = data.find(x=>x.id===cur);
  c.entries.push({id:uid(), amt:mode*n, note:$("eNote").value.trim(),
    date:new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})});
  save(); close(); renderDetail();
};

$("wa").onclick = () => {
  const c = data.find(x=>x.id===cur), b = bal(c);
  if(b<=0){
    $("wa").textContent = "Is customer ka koi baaki nahi hai";
    setTimeout(() => { $("wa").textContent = "WhatsApp par yaad dilayein"; }, 2500);
    return;
  }
  const msg = `Namaste ${c.name} ji, aapka ${rs(b)} baaki hai. Kripya jaldi bhej dein. Dhanyavaad!`;
  let ph = (c.phone||"").replace(/\D/g,"");
  if(ph.length===10) ph = "91"+ph;
  const a = document.createElement("a");
  a.href = "https://wa.me/"+ph+"?text="+encodeURIComponent(msg);
  a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
};let armed = false;
$("delC").onclick = () => {
  if(!armed){
    armed = true;
    $("delC").textContent = "Pakka? Hatane ke liye dobara dabayein";
    setTimeout(() => { armed = false; $("delC").textContent = "Is customer ko hatayein"; }, 4000);
    return;
  }
  armed = false; $("delC").textContent = "Is customer ko hatayein";
  data = data.filter(x=>x.id!==cur); save(); show("home");
};

let armedE = null;
$("entries").onclick = ev => {
  const b = ev.target.closest(".xdel"); if(!b) return;
  if(armedE !== b.dataset.e){ armedE = b.dataset.e; b.textContent = "pakka? dobara dabayein"; return; }
  const c = data.find(x=>x.id===cur);
  c.entries = c.entries.filter(x=>x.id!==armedE); armedE = null; save(); renderDetail();
};

$("bk").onclick = () => { $("bkTxt").value = ""; open("sheetB"); };
$("bkShow").onclick = () => { $("bkTxt").value = JSON.stringify(data); $("bkTxt").select(); };
$("bkWa").onclick = () => {
  const a = document.createElement("a");
  a.href = "https://wa.me/?text=" + encodeURIComponent("KHATA-BACKUP " + JSON.stringify(data));
  a.target = "_blank"; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
};
$("bkRestore").onclick = () => {
  const t = $("bkTxt").value.trim().replace(/^KHATA-BACKUP\s*/, "");
  try{
    const d = JSON.parse(t);
    if(!Array.isArray(d)) throw 0;
    data = d; save(); close(); renderHome();
  }catch(e){
    const b = $("bkRestore"); b.textContent = "Text sahi nahi hai, dobara paste karein";
    setTimeout(() => { b.textContent = "Restore karein (abhi ka data badal jayega)"; }, 3000);
  }
};

load(); renderHome();
</script>
</body>
</html>
  v==="home" ? renderHome() : renderDetail();
}
const open = id => $(id).classList.add("on");
const close = () => document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on"));
