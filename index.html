<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Khata</title>
<style>
:root{--bg:#f3f5f1;--ink:#1d2a24;--mute:#6b7a72;--card:#fff;--line:#dfe5df;--green:#1b7a4b;--red:#c23b2e;--brand:#14532d}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;min-height:100vh}
header{background:var(--brand);color:#fff;padding:18px 16px 22px}
header h1{font-size:20px;font-weight:700}
.total{margin-top:10px;font-size:13px;opacity:.85}
.total b{display:block;font-size:32px;font-weight:800;opacity:1;margin-top:2px}
.bar{display:flex;gap:8px;padding:12px 16px}
input,button{font:inherit}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.ghost{background:#e6ece6;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;background:var(--card);margin:0 16px 8px;padding:14px;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
.row small{color:var(--mute);display:block;margin-top:2px}
.amt{font-weight:800;font-size:17px}
.due{color:var(--red)}.adv{color:var(--green)}.zero{color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:40px 24px;line-height:1.5}
.back{background:none;border:0;color:#fff;font-weight:700;cursor:pointer;padding:0 0 10px;font-size:15px}
.actions{display:flex;gap:8px;padding:12px 16px}.actions .btn{flex:1}
.entry{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.entry small{color:var(--mute)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 24px;display:grid;gap:10px}
.box h2{font-size:18px}
.hide{display:none}
.link{background:none;border:0;color:var(--red);padding:16px;cursor:pointer;font-weight:600}
.xdel{background:none;border:0;color:var(--mute);font-size:12px;padding:6px 0 0;cursor:pointer;text-decoration:underline}
.entry .amt{text-align:right}
